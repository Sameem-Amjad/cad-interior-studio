<script>
        // Simple visual feedback for drag and drop (visual only, actual logic requires backend/complex JS)
        const dropZone = document.querySelector('label');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('border-primary', 'bg-surface-container-low');
            dropZone.classList.remove('border-border-subtle', 'bg-surface-container-lowest');
        }

        function unhighlight(e) {
            dropZone.classList.remove('border-primary', 'bg-surface-container-low');
            dropZone.classList.add('border-border-subtle', 'bg-surface-container-lowest');
        }
    </script>
